[package]
name = "jevision-runner"
description = "Runs JEVision flowchart UI tests through a platform-specific input/output layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = { version = "0.10", default-features = false }
jevision-core.workspace = true
jevision-l10n.workspace = true
jevision-vision.workspace = true
libc = "0.2"
plist = { version = "1.10", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
thiserror.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
zip = { version = "7.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
png = "0.18"
