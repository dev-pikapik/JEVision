[package]
name = "jevision-ffi"
description = "UniFFI bindings that expose the JEVision core to the native apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "jevision_ffi"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
base64 = "0.23"
jevision-core.workspace = true
jevision-git.workspace = true
jevision-l10n.workspace = true
jevision-notify.workspace = true
jevision-remote.workspace = true
jevision-runner.workspace = true
jevision-vision.workspace = true
libc = "0.2"
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
png = "0.18"
zip = { version = "7.3", default-features = false, features = ["deflate-flate2"] }
