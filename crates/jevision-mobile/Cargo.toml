[package]
name = "jevision-mobile"
description = "UniFFI bindings that let the JEVision iPhone app control a Mac"
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true

[lib]
name = "jevision_mobile"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
jevision-l10n.workspace = true
jevision-remote = { path = "../jevision-remote", default-features = false, features = ["client"] }
jevision-runner.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi.workspace = true

[dev-dependencies]
jevision-remote = { path = "../jevision-remote" }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
