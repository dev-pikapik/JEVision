[package]
name = "jevision-remote"
description = "Remote control of JEVision from a phone: pairing, device sign-in and the Mac-to-phone protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["host", "client"]
host = ["dep:jevision-core"]
client = []

[dependencies]
jevision-l10n.workspace = true
jevision-core = { workspace = true, optional = true }
jevision-runner.workspace = true
getrandom = "0.4"
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
subtle = "2.6"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

# libc 0.2.190 limited `in6_ifreq` and the interface statistics types to macOS, which breaks
# netdev 0.46 (through iroh's netwatch) on iOS. Lift the cap once netdev builds for iOS again.
[target.'cfg(target_os = "ios")'.dependencies]
libc = ">=0.2.183, <0.2.190"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "test-host"
required-features = ["host"]
