[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dev-pikapik/JEVision"

[workspace.dependencies]
jevision-core = { path = "crates/jevision-core" }
jevision-runner = { path = "crates/jevision-runner" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = "0.32"

[profile.release]
lto = true
