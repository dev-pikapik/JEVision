[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dev-pikapik/JEVision"

[workspace.dependencies]
jevision-core = { path = "crates/jevision-core" }
jevision-git = { path = "crates/jevision-git" }
jevision-l10n = { path = "crates/jevision-l10n" }
jevision-notify = { path = "crates/jevision-notify" }
jevision-remote = { path = "crates/jevision-remote" }
jevision-runner = { path = "crates/jevision-runner" }
jevision-schema = { path = "crates/jevision-schema" }
jevision-vision = { path = "crates/jevision-vision" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = "0.32"

[profile.release]
lto = true
# File and line of every frame in a crash report; the app keeps them in its dSYM, not in the binary.
debug = "line-tables-only"
