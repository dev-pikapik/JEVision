name: Feature or block request
description: Suggest a new feature or a new block type
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/dev-pikapik/JEVision/issues?q=is%3Aissue) first. To talk an idea through before it is ready, start a [discussion](https://github.com/dev-pikapik/JEVision/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A sketch of the block in JSON is very helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried or thought of, and why they fall short.
