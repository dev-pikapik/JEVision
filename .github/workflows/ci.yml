name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs every test of CI before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh for the Command block tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Version, lock file and changelog agree
        if: runner.os == 'Linux'
        run: scripts/check-version.sh
      - name: Documentation links
        if: runner.os == 'Linux'
        run: python3 docs/check-links.py
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  timing:
    name: Core speed
    # Time is for a quiet machine to say, so the tests that hold the core to its time limits run
    # alone on a runner of their own, and not beside the other tests. On a pull request too, so a
    # slowdown shows before the merge; keep this check out of the required ones, since a runner
    # that is slow that day says nothing about the change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Large project stays fast
        run: cargo test -p jevision-ffi --test large_project --locked -- --ignored a_large_project_stays_fast

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links, navigation and search index
        run: python3 docs/check-links.py

  core-swift:
    name: Core for Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework and Swift bindings
        run: scripts/build-core-apple.sh
        env:
          PROFILE: debug
      - name: Test Swift bindings
        run: swift test --package-path build/apple/JEVisionCore

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build core and app, check localization
        run: apps/macos/scripts/build.sh
        env:
          PROFILE: debug
      - name: Example tests are canonical
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision fmt --check examples
      - name: Example tests are valid
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision validate examples
      - name: Self-test project is canonical
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision fmt --check selftest
      - name: Self-test project is valid
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision validate selftest
      - name: Test app
        run: swift test --package-path apps/macos

  ios-app:
    name: iPhone app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # The Rust library of the simulator slice is arm64 only, like the runner.
      - name: Build and test on a simulator
        run: |
          udid=$(xcrun simctl list devices available iPhone -j | python3 -c '
          import json, sys
          phones = [d for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["isAvailable"]]
          print(sorted(phones, key=lambda d: d["name"])[0]["udid"])')
          xcodebuild test -project apps/ios/JEVisionRemote.xcodeproj -scheme JEVisionRemote \
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/ios \
            -only-testing:JEVisionRemoteTests CODE_SIGNING_ALLOWED=NO
      - name: The app carries the version of the core
        run: |
          plist=build/ios/Build/Products/Debug-iphonesimulator/JEVisionRemote.app/Info.plist
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$(scripts/version.sh version)" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$(scripts/version.sh build)" ]
      - name: Every iPhone string is translated
        run: python3 apps/macos/scripts/check-localization.py --ios build/ios
      - name: The App Store texts are complete and fit the limits
        run: python3 apps/ios/scripts/check-metadata.py

  release-build:
    name: Release build and packaging
    # Packaging is slow on the shared macOS queue: run it on main and on demand. A tag is built
    # for real by the release workflow.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: apps/macos/.build/artifacts
          key: swiftpm-artifacts-${{ hashFiles('apps/macos/Package.resolved') }}
      # Ad-hoc signed: proves the release build, Sparkle embedding and the disk image without secrets.
      - name: Build release disk image
        run: apps/macos/scripts/release.sh
        env:
          ADHOC: "1"
      - name: Fill the Homebrew cask from the disk image
        run: packaging/homebrew/update-cask.sh apps/macos/build/JEVision-*.dmg

  selftest:
    name: Self-test
    # JEVision's own tests drive the app on a real screen: slow on the shared macOS queue, so it
    # runs on main and on demand (Actions > CI > Run workflow).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: apps/macos/scripts/build.sh
        env:
          PROFILE: debug
      # Nobody can click "Allow" on a hosted runner: the same permissions a person gives the app
      # are written into the privacy database before it first starts. The two copies are the
      # app that runs the tests (Driver) and the one the tests operate (Subject).
      - name: Allow the app to see and control the screen
        run: |
          scripts/ci-allow-ui-control.sh io.github.dev-pikapik.jevision \
            "$JEVISION_SELFTEST_WORK/Driver/JEVision.app" \
            "$JEVISION_SELFTEST_WORK/Subject/JEVision.app" \
            "$PWD/apps/macos/build/JEVision.app"
        env:
          JEVISION_SELFTEST_WORK: ${{ runner.temp }}/selftest
      - name: Run the self-test
        run: scripts/selftest.sh --no-build
        env:
          JEVISION_SELFTEST_WORK: ${{ runner.temp }}/selftest
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: ${{ runner.temp }}/selftest/report
          if-no-files-found: ignore
