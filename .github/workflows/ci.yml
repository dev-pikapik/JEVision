name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh for the Command block tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  timing:
    name: Core speed
    # Time is for a quiet machine to say, so the tests that hold the core to its time limits run
    # alone, on main and on demand, and not beside the rest of a pull request's checks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Large project stays fast
        run: cargo test -p jevision-ffi --test large_project --locked -- --ignored a_large_project_stays_fast

  core-swift:
    name: Core for Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework and Swift bindings
        run: scripts/build-core-apple.sh
        env:
          PROFILE: debug
      - name: Test Swift bindings
        run: swift test --package-path build/apple/JEVisionCore

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build core and app, check localization
        run: apps/macos/scripts/build.sh
        env:
          PROFILE: debug
      - name: Example tests are canonical
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision fmt --check examples
      - name: Example tests are valid
        run: apps/macos/build/JEVision.app/Contents/Helpers/jevision validate examples
      - name: Test app
        run: swift test --package-path apps/macos

  release-build:
    name: Release build and packaging
    # Packaging is slow on the shared macOS queue: run it on main and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: apps/macos/.build/artifacts
          key: swiftpm-artifacts-${{ hashFiles('apps/macos/Package.resolved') }}
      # Ad-hoc signed: proves the release build, Sparkle embedding and the disk image without secrets.
      - name: Build release disk image
        run: apps/macos/scripts/release.sh
        env:
          ADHOC: "1"
      - name: Fill the Homebrew cask from the disk image
        run: packaging/homebrew/update-cask.sh apps/macos/build/JEVision-*.dmg
